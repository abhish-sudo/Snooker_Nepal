{% extends 'base.html' %}
{% load static %}

{% block title %}Redirecting — Snooker Nepal{% endblock %}

{% block extra_css %}
<style>
  :root {
    --sn-green: #2d7a4f;
    --sn-dark: #0e1a12;
    --sn-bg: #f4f7f5;
  }

  .redirect-page {
    background: var(--sn-bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }

  .redirect-box {
    max-width: 400px;
  }

  .redirect-spinner {
    width: 48px;
    height: 48px;
    border: 3px solid rgba(45,122,79,0.15);
    border-top-color: var(--sn-green);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }

  .redirect-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    color: var(--sn-dark);
    margin-bottom: 8px;
  }

  .redirect-text {
    font-size: 0.82rem;
    color: #6b7f72;
    line-height: 1.6;
  }

  .redirect-link {
    display: inline-block;
    margin-top: 20px;
    font-size: 0.72rem;
    color: var(--sn-green);
    text-decoration: none;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    border-bottom: 1px solid currentColor;
    padding-bottom: 2px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
{% endblock %}

{% block content %}
<section class="redirect-page">
  <div class="redirect-box">
    <div class="redirect-spinner"></div>
    <h1 class="redirect-title">Redirecting...</h1>
    <p class="redirect-text">Taking you to your order confirmation. Please wait.</p>
    <a href="{% url 'orders:success_page' order_number=order_number %}"
       class="redirect-link">
      Click here if not redirected
    </a>
  </div>
</section>

<script>
  // Auto redirect in case the view redirect fails
  setTimeout(function() {
    window.location.href = "{% url 'orders:success_page' order_number=order_number %}";
  }, 1500);
</script>
{% endblock %}
